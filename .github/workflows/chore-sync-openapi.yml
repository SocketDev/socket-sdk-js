name: 'chore: sync OpenAPI'
run-name: 'chore: sync OpenAPI'

on:
  push:
    paths:
      - '.github/workflows/chore-sync-openapi.yml'
      - 'scripts/repo/check/api-contracts-are-current.mts'
      - 'scripts/repo/generate-*.mts'
      - 'scripts/repo/openapi-contracts.mts'
      - 'scripts/repo/package-artifact-is-complete.mts'
      - 'src/types/core.mts'
      - 'types/api-helpers.d.ts'
  schedule:
    - cron: '23 7 * * 1-5'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  sync:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-26.04
    permissions:
      actions: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: pr-app
        with:
          app-id: ${{ secrets.SOCKET_PR_CLIENT_ID }}
          private-key: ${{ secrets.SOCKET_PR_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.pr-app.outputs.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Install pnpm
        run: npm install --global pnpm@12.14.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate contracts and API docs
        run: pnpm run update:openapi
      - name: Verify generated contracts
        run: >-
          pnpm run check:api-contracts && pnpm run repo:type && pnpm run build &&
          pnpm run check:package-artifact
      - name: Create signed update pull request
        shell: bash
        env:
          GH_TOKEN: ${{ steps.pr-app.outputs.token }}
          BOT_GPG_PRIVATE_KEY: ${{ secrets.BOT_GPG_PRIVATE_KEY }}
          APP_SLUG: ${{ steps.pr-app.outputs.app-slug }}
        run: |
          node scripts/repo/generate-sdk.mts --list-artifacts | git add --pathspec-from-file=-
          git add -- docs/api.md
          if git diff --cached --quiet; then
            echo 'OpenAPI contracts are current.'
            exit 0
          fi
          printf '%s' "$BOT_GPG_PRIVATE_KEY" | gpg --batch --import
          FINGERPRINT="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          test -n "$FINGERPRINT"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git config user.signingkey "$FINGERPRINT"
          git config commit.gpgsign true
          git switch --create automated/open-api
          git commit -S -m 'fix(openapi): sync API contracts'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')" \
            push --force origin HEAD:refs/heads/automated/open-api
          BODY="$RUNNER_TEMP/openapi-pr-body.md"
          cat > "$BODY" <<'TEXT'
          Updates the generated OpenAPI contracts from the current API schema.

          Verified with `pnpm run check:api-contracts`, `pnpm run repo:type`, `pnpm run build`, and `pnpm run check:package-artifact`.
          TEXT
          PR="$(gh pr list --head automated/open-api --base "$GITHUB_REF_NAME" --json number --jq '.[0].number // empty')"
          if [ -z "$PR" ]; then
            gh pr create --head automated/open-api --base "$GITHUB_REF_NAME" \
              --title 'fix(openapi): sync API contracts' --body-file "$BODY" \
              --label dependencies --label automated
          else
            gh pr edit "$PR" --title 'fix(openapi): sync API contracts' --body-file "$BODY"
          fi

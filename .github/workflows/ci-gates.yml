name: 'ci: gates'
run-name: 'ci: gates'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Install pnpm
        run: npm install --global pnpm@12.14.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check and build
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm run check
      - name: Verify package contents
        run: pnpm run check:package-artifact
      - name: Set up minimum supported Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.0.0
      - name: Verify runtime exports
        run: >-
          node --input-type=module -e
          'import { SocketSdk } from "./dist/index.js";
          if (typeof SocketSdk !== "function") throw new TypeError("SocketSdk export is not callable");
          process.stdout.write(`SocketSdk loaded under Node ${process.versions.node}\n`);'

  test:
    name: 'Test (${{ matrix.os }})'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Install pnpm
        run: npm install --global pnpm@12.14.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build package
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm run build
      - name: Run tests
        run: pnpm test

name: 🔄 Sync openapi
run-name: Sync v0 and v1 contracts

on:
  push:
    paths:
      - '.github/workflows/sync-openapi.yml'
      - 'scripts/repo/generate-*.mts'
      - 'scripts/repo/openapi-contracts.mts'
      - 'scripts/repo/check/api-contracts-are-current.mts'
      - 'scripts/repo/package-artifact-is-complete.mts'
      - 'types/api-helpers.d.ts'
  schedule:
    - cron: '23 7 * * 1-5'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  fetch_and_update:
    name: Sync v0 and v1 contracts
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 (2026-05-15)
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up and install
        uses: ./.github/actions/fleet/setup-and-install
        with:
          checkout: 'false'
          payload-token-client-id: ${{ vars.SOCKET_PR_CLIENT_ID }}
          payload-token-private-key: ${{ secrets.SOCKET_PR_APP_PRIVATE_KEY }}
          socket-api-token: ${{ secrets.SOCKET_API_TOKEN_FOR_CLI_AND_SFW }}
      - name: Set up commit signing
        uses: ./.github/actions/fleet/setup-git-signing
        with:
          gpg-private-key: ${{ secrets.BOT_GPG_PRIVATE_KEY }}

      - name: Generate both contracts
        run: |
          pnpm --silent run generate-sdk --list-artifacts > "$RUNNER_TEMP/openapi-artifacts.txt"
          pnpm run generate-sdk

      - name: Verify generated contracts
        run: |
          pnpm run check:api-contracts
          pnpm run type
          pnpm test test/repo/unit/openapi-contracts.test.mts test/repo/unit/openapi-response-types.test.mts test/repo/unit/openapi-multipart.test.mts
          pnpm run check:quota-sync
          pnpm run build
          pnpm run check:package-artifact

      - name: Check generated artifacts for changes
        id: check
        run: |
          mapfile -t artifact_paths < "$RUNNER_TEMP/openapi-artifacts.txt"
          if [ -n "$(git status --porcelain -- "${artifact_paths[@]}")" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push generated artifacts
        if: steps.check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t artifact_paths < "$RUNNER_TEMP/openapi-artifacts.txt"
          git switch --create automated/open-api
          git add -- "${artifact_paths[@]}"
          git commit -m "fix(openapi): sync v0 and v1 contracts"
          previous_head="$(git -c credential.helper='!gh auth git-credential' ls-remote origin refs/heads/automated/open-api | cut -f1)"
          git -c credential.helper='!gh auth git-credential' push \
            --force-with-lease="refs/heads/automated/open-api:$previous_head" \
            origin HEAD:refs/heads/automated/open-api

      - name: Create or update pull request
        if: steps.check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          cat > "$RUNNER_TEMP/openapi-pr-body.md" <<'BODY'
          Synchronizes the v0 and v1 OpenAPI snapshots and generated TypeScript contracts.
          The v0 strict types and strict type exports follow the same generation pass.

          Validation: offline contract freshness, TypeScript, generator tests, quota synchronization, build, and packed declaration imports.
          BODY
          existing_pr="$(gh pr list --head automated/open-api --base "$DEFAULT_BRANCH" --json number --jq '.[0].number // empty')"
          if [ -z "$existing_pr" ]; then
            gh pr create \
              --head automated/open-api \
              --base "$DEFAULT_BRANCH" \
              --title "fix(openapi): sync v0 and v1 contracts" \
              --body-file "$RUNNER_TEMP/openapi-pr-body.md" \
              --label dependencies \
              --label automated
          else
            gh pr edit "$existing_pr" \
              --title "fix(openapi): sync v0 and v1 contracts" \
              --body-file "$RUNNER_TEMP/openapi-pr-body.md"
          fi

      - name: Trigger CI checks
        if: steps.check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref automated/open-api

      - name: Clean up commit signing
        uses: ./.github/actions/fleet/cleanup-git-signing
        if: always()
